<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/pencil-ruler-2-line.png">
    <title>CalculatorP</title>
    <link href ="style.css" rel="stylesheet" type ="text/css"/>
    <link href ="utils.css" rel="stylesheet" type ="text/css"/>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <style>       
      @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap'); 
     </style>
    
    

</head>
<body>
   <div>
    <div class="Uppertext">
        Simple Calculator✏️
    </div>
        <div class="container flex flex-col items-center bg-red mx-auto m-w-20">
        <div class="row">
            <input class="input" type="text" placeholder="0" />
        </div>
         <div class="row">
            <button class="button" id="operator">M+</button>
            <button class="button" id="operator">M-</button>
            <button class="button" id="operator">√</button>
            <button class="button" id="operator">C</button>
        </div>
        <div class="row">
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button" id="operator">X</button>
        </div>
        <div class="row">
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button" id="operator">-</button>
        </div>
         <div class="row">
            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button" id="operator">+</button>
        </div>
           <div class="row last">
            <button class="button zero">0</button>
            <button class="button" id="operator">.</button>
             <button class="button" id="operator">/</button>
            <button class="button" id="equals">=</button>
            
        </div>
    </div>
   </div>
  <script src="script.js"></script>  
</body>
</html>
